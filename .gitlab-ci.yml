workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - build

variables:
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/android-sdk"
  ANDROID_API_LEVEL: "34"
  ANDROID_ABI: "arm64-v8a"
  ANDROID_NDK_VERSION: "29.0.14206865"
  ANDROID_BUILD_TOOLS_VERSION: "37.0.0"
  GO_VERSION: "1.25.0"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

build-apk:
  stage: build
  image: eclipse-temurin:21-jdk
  interruptible: true
  cache:
    key:
      files:
        - gradle/libs.versions.toml
        - rcbridge/go.sum
    paths:
      - .gradle/
      - .gopath/pkg/mod/
      - .gocache/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl unzip git ca-certificates
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - >-
      curl --fail --silent --show-error --location
      --output /tmp/commandlinetools.zip
      https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip
    - unzip -q /tmp/commandlinetools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
    - >-
      mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools"
      "$ANDROID_SDK_ROOT/cmdline-tools/latest"
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --licenses >/dev/null || true
    - >-
      sdkmanager
      "platform-tools"
      "platforms;android-${ANDROID_API_LEVEL}"
      "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"
      "ndk;${ANDROID_NDK_VERSION}"
    - >-
      curl --fail --silent --show-error --location
      --output /tmp/go.tar.gz
      "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz"
    - tar -C /usr/local -xzf /tmp/go.tar.gz
    - export PATH="/usr/local/go/bin:$PATH"
    - go version
    - chmod +x ./gradlew
  script:
    - ./gradlew --no-daemon -Prsaf.abis="${ANDROID_ABI}" assembleDebug
  artifacts:
    name: "RSAF-${CI_COMMIT_SHORT_SHA}-${ANDROID_ABI}"
    expire_in: 7 days
    paths:
      - app/build/outputs/apk/arm64-v8a/debug/
